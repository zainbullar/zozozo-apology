<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>for zobia, my lovely wife</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe6ee, #fff1f6);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* stickers (UNCHANGED) */
  .sticker {
    position: absolute;
    font-size: 26px;
    opacity: 0.55;
    animation: float 7s infinite ease-in-out;
  }

  .s1 { left: 5%; top: 15%; }
  .s2 { right: 6%; top: 25%; animation-delay: 1s; }
  .s3 { left: 8%; bottom: 20%; animation-delay: 2s; }
  .s4 { right: 10%; bottom: 15%; animation-delay: 3s; }
  .s5 { left: 15%; top: 45%; animation-delay: 4s; }
  .s6 { right: 15%; bottom: 40%; animation-delay: 5s; }

  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  /* CONFETTI */
  .confetti {
    position: fixed;
    width: var(--size);
    height: var(--size);
    background: var(--color);
    border-radius: var(--radius);
    pointer-events: none;
    animation: blast 4s cubic-bezier(.15,.8,.35,1) forwards;
    z-index: 1;
  }

  @keyframes blast {
    0% {
      transform: translate(0,0) rotate(0deg) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--xMove), var(--yMove)) rotate(var(--rot)) scale(0.9);
      opacity: 0;
    }
  }

  /* card */
  .card {
    background: #ffffffdd;
    backdrop-filter: blur(8px);
    padding: 42px 48px;
    border-radius: 28px;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 25px 45px rgba(255, 182, 193, 0.35);
    z-index: 2;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: #b55c7a;
    margin-bottom: 18px;
  }

  p {
    line-height: 1.9;
    font-size: 16px;
    color: #5f4b53;
    margin-bottom: 28px;
  }

  button {
    margin: 12px;
    padding: 12px 22px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background: #cfccf0;
    color: #3f3b6d;
  }

  #noBtn {
    background: #cce7ff;
    position: absolute;
  }

  .fade {
    animation: fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #forgiveMessage,
  #reasonsSection,
  #finalMessage {
    display: none;
    margin-top: 32px;
    font-weight: 500;
    color: #b55c7a;
  }

  #reason {
    margin-top: 18px;
    font-size: 15px;
    color: #5f4b53;
    line-height: 1.8;
  }
</style>
</head>
<body>

<!-- stickers -->
<div class="sticker s1">💗</div>
<div class="sticker s2">🎀</div>
<div class="sticker s3">🌸</div>
<div class="sticker s4">💞</div>
<div class="sticker s5">⭐️</div>
<div class="sticker s6">🧁</div>

<div class="card">
  <h1>hi zobia 💕</h1>
  <p>i’m really sorry i missed your birthday. can you find it in your heart to forgive me?</p>

  <div id="forgiveSection">
    <button id="yesBtn" onclick="forgiveMe()">yes, i can</button>
    <button id="noBtn" onmouseover="moveNo()">no, u suck</button>
  </div>

  <div id="forgiveMessage" class="fade">
    thank u so much zo
  </div>

  <div id="reasonsSection">
    <button onclick="showReason()">reasons why i love you 💖</button>
    <div id="reason" class="fade"></div>
  </div>

  <div id="finalMessage" class="fade">
    🎂 happy belated birthday, my love 💕
  </div>
</div>

<script>
const reasons = [
  "you've been there for me, even tho we're so far away",
  "you're so patient and understanding",
  "you always match my energy",
  "your smile makes me smile",
  "i think you're absolutely perfect",
  "you're such a genuine person",
  "i feel really happy around you",
  "you make me feel safe",
  "your taste is elite",
  "you're really funny"
];

let index = 0;
let yesScale = 1;

function moveNo() {
  const noBtn = document.getElementById("noBtn");
  noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
  yesScale += 0.15;
  document.getElementById("yesBtn").style.transform = `scale(${yesScale})`;
}

function forgiveMe() {
  document.getElementById("forgiveSection").style.display = "none";
  document.getElementById("forgiveMessage").style.display = "block";
  document.getElementById("reasonsSection").style.display = "block";
  megaConfetti();
}

function showReason() {
  const r = document.getElementById("reason");
  r.style.display = "block";
  r.innerText = reasons[index++];
  if (index === reasons.length) {
    document.getElementById("finalMessage").style.display = "block";
  }
}

function megaConfetti() {
  const colors = [
    "#ff3f8e", "#ff9f1c", "#7b61ff",
    "#00d4ff", "#ffde59", "#ff6b6b"
  ];

  const bursts = 6; // multiple explosions
  const piecesPerBurst = 250;

  for (let b = 0; b < bursts; b++) {
    const originX = Math.random() * window.innerWidth;
    const originY = Math.random() * window.innerHeight;

    for (let i = 0; i < piecesPerBurst; i++) {
      const c = document.createElement("div");
      c.className = "confetti";

      const size = 10 + Math.random() * 14;
      const angle = Math.random() * Math.PI * 2;
      const distance = 400 + Math.random() * 600;

      c.style.left = originX + "px";
      c.style.top = originY + "px";
      c.style.setProperty("--size", size + "px");
      c.style.setProperty("--xMove", Math.cos(angle) * distance + "px");
      c.style.setProperty("--yMove", Math.sin(angle) * distance + "px");
      c.style.setProperty("--rot", Math.random() * 720 + "deg");
      c.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
      c.style.setProperty("--radius", Math.random() > 0.5 ? "50%" : "3px");

      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }
}
</script>

</body>
</html>
