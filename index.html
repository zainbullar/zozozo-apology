<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>for zobia, my lovely wife</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe6ee, #fff1f6);
    font-family: 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
  }

  /* stickers - fixed positions */
  .sticker {
    position: absolute;
    font-size: 28px;
    opacity: 0.6;
  }

  /* left side */
  .s1 { left: 5%; top: 15%; }
  .s2 { left: 5%; top: 45%; }
  .s3 { left: 5%; top: 75%; }

  /* right side */
  .s4 { right: 5%; top: 15%; }
  .s5 { right: 5%; top: 45%; }
  .s6 { right: 5%; top: 75%; }

  /* confetti */
  .confetti {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    opacity: 0.8;
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-10px); opacity:1; }
    80% { opacity:1; }
    100% { transform: translateY(110vh); opacity:0; }
  }

  /* card */
  .card {
    background: #ffffffdd;
    backdrop-filter: blur(8px);
    padding: 42px 48px;
    border-radius: 28px;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 25px 45px rgba(255, 182, 193, 0.35);
    z-index: 1;
    position: relative;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    color: #b55c7a;
    margin-bottom: 18px;
  }

  p {
    line-height: 1.9;
    font-size: 16px;
    color: #5f4b53;
    margin-bottom: 28px;
  }

  button {
    margin: 12px;
    padding: 12px 22px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.3s ease;
  }

  #yesBtn {
    background: #cfccf0;
    color: #3f3b6d;
  }

  #noBtn {
    background: #cce7ff;
    position: absolute;
  }

  .fade {
    animation: fadeIn 1.2s ease forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #forgiveMessage,
  #reasonsSection,
  #finalMessage {
    display: none;
    margin-top: 32px;
    font-weight: 500;
    color: #b55c7a;
  }

  #reason {
    margin-top: 18px;
    font-size: 15px;
    color: #5f4b53;
    line-height: 1.8;
  }
</style>
</head>
<body>

<!-- stickers -->
<div class="sticker s1">💗</div>
<div class="sticker s2">🎀</div>
<div class="sticker s3">🌸</div>
<div class="sticker s4">💞</div>
<div class="sticker s5">⭐️</div>
<div class="sticker s6">🧁</div>

<div class="card">

<h1>hi zobia 💕</h1>
<p>i’m really sorry i missed your birthday</p>

<div id="forgiveSection">
  <button id="yesBtn" onclick="forgiveMe()">yes, it's okay</button>
  <button id="noBtn" onmouseover="moveNo()">no, u suck</button>
</div>

<div id="forgiveMessage" class="fade">
  thank u sososo much, i love u
</div>

<div id="reasonsSection">
  <button onclick="showReason()">reasons why i love you 💖</button>
  <div id="reason" class="fade"></div>
</div>

<div id="finalMessage" class="fade">
  🎂 happy belated birthday, my love 💕
</div>

</div>

<script>
// REASONS
const reasons = [
  "you've been there for me, even tho we're so far away",
  "you're so patient and understanding",
  "you always match my energy, i never feel like i'm annoying you",
  "your smile makes me smile",
  "i think you're absolutely perfect. nothing less",
  "you're such a genuine and bright person",
  "i feel really happy around you",
  "you make me feel like a good person",
  "your film and music taste is elite",
  "you're really funny"
];

let index = 0;
let yesScale = 1;

// YES/NO button
function moveNo() {
  const noBtn = document.getElementById("noBtn");
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesScale += 0.15;
  document.getElementById("yesBtn").style.transform = `scale(${yesScale})`;
}

function forgiveMe() {
  document.getElementById("forgiveSection").style.display = "none";
  document.getElementById("forgiveMessage").style.display = "block";
  document.getElementById("reasonsSection").style.display = "block";
}

function showReason() {
  const r = document.getElementById("reason");
  r.style.display = "block";
  r.innerText = reasons[index];

  index++;

  if (index === reasons.length) {
    document.getElementById("finalMessage").style.display = "block";
  }
}

// CONFETTI BURST
function createConfetti(){
  for(let i=0;i<400;i++){
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.background = `hsl(${Math.random()*360}, 70%, 85%)`;
    c.style.left = Math.random()*100 + "vw";
    c.style.width = c.style.height = (3+Math.random()*3)+"px";
    c.style.animationDuration = (0.6 + Math.random()*1) + "s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),3000); // remove after 3s
  }
}

// trigger confetti once on page load
createConfetti();

</script>
</body>
</html>
